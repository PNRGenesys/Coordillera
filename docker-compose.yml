services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cordillera
      POSTGRES_USER: cordillera
      POSTGRES_PASSWORD: cordillera_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cordillera -d cordillera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
