services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coordillera
      POSTGRES_USER: coordillera
      POSTGRES_PASSWORD: coordillera_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordillera -d coordillera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
