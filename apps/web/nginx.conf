server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy /api on the same origin so the frontend keeps calling the
    # relative "/api/" path and the httpOnly session cookie works without CORS.
    # All API traffic goes through the middleware, which forwards to the internal
    # Fastify service. "middleware" resolves over the compose network.
    location /api/ {
        proxy_pass http://middleware:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
